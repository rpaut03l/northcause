[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northcause-python"
version = "0.1.0"
description = "NorthCause evidence-led AI operations assurance pilot"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "cryptography>=43.0"]

[project.optional-dependencies]
cloudflare = ["workers-py", "workers-runtime-sdk"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
causepath = "northcause_cli.causepath:main"
causepilot = "northcause_cli.causepilot:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "northcause_cli"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
