    <rect x="216" width="204" height="46" rx="23" fill="#f4f7ff" stroke="#e2e9f6"/><text x="318" y="29" text-anchor="middle" fill="#3f506d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650">INFRA · RELEASE</text>
  </g>
  <g transform="translate(872 172)">
    <rect x="-43" y="-27" width="209" height="209" rx="42" fill="#f2f5ff" stroke="#e0e8fb" stroke-width="2"/>
    <g transform="translate(860 153) scale(1.35)">
      <path d="M30 132V43L112 129V42" fill="none" stroke="url(#mark)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M112 17L120 37L112 32L104 37Z" fill="#715BFF"/><circle cx="30" cy="132" r="7" fill="#155EEF"/>
    </g>
    <text x="-31" y="239" fill="#101a31" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="750" letter-spacing="-1.2">NorthCause</text>
    <text x="-29" y="273" fill="#63718a" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="1.3">BY NARMADYA INNOVATIONS</text>
