<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NorthCause — Find it. Fix it. Prove it.</title>
  <desc id="desc">AI production incident investigation with evidence from model behavior to release.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="mark" x1="24" y1="140" x2="120" y2="34" gradientUnits="userSpaceOnUse"><stop stop-color="#155EEF"/><stop offset="1" stop-color="#705BFF"/></linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#155EEF"/><stop offset="1" stop-color="#705BFF"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c7d5f5" opacity=".6"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <circle cx="1035" cy="70" r="305" fill="#e4eaff" opacity=".62"/>
  <circle cx="1120" cy="550" r="265" fill="#e4f3f4" opacity=".55"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity=".32"/>
  <rect x="54" y="54" width="1092" height="522" rx="30" fill="#fff" stroke="#e3e9f3" stroke-width="2"/>
  <rect x="90" y="91" width="13" height="13" rx="6.5" fill="#155eef"/>
  <text x="119" y="104" fill="#3159b9" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.5">AI PRODUCTION INCIDENT INVESTIGATION</text>
  <text x="91" y="226" fill="#101a31" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="750" letter-spacing="-3">Find the cause.</text>
  <text x="91" y="315" fill="url(#type)" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="750" letter-spacing="-3">Verify the fix.</text>
  <text x="96" y="370" fill="#58667c" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400">Evidence from model behavior to release.</text>
