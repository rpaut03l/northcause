  <line x1="91" y1="524" x2="1107" y2="524" stroke="#e8edf5" stroke-width="2"/>
  <text x="93" y="555" fill="#6c7a90" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Connect evidence. Investigate with context. Verify the release.</text>
  <text x="1105" y="555" text-anchor="end" fill="#53627b" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">northcause.com</text>
